# ASUS must initialize RDPA and its consumers in the vendor's explicit order.
# udev/libkmod applies this blacklist to modalias probing; explicit insmod
# remains available to the ASUS loader. Generic Linux hotplug is unchanged.
blacklist bcm_bca_usb
blacklist bcm_pcie_hcd
blacklist bcmflex
blacklist bcmspu
blacklist dhd
blacklist hs_uart_drv
blacklist rdpa_cmd
blacklist rdpa_gpl
