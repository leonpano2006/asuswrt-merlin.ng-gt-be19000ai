# systemd owns the IPv4 port 2222 listener and binds it to br0.
# No vendor NVRAM, password decryption, broker request, or ordinary SSH config
# is read by this independent inetd-mode OpenSSH instance.
Port 2222
AddressFamily inet
HostKey /etc/ssh/ssh_host_ed25519_key
HostKeyAlgorithms ssh-ed25519
AllowUsers MastermixStudios@192.168.100.0/24
PermitRootLogin no
AuthenticationMethods publickey
PubkeyAuthentication yes
PubkeyAcceptedAlgorithms ssh-ed25519
AuthorizedKeysFile /var/lib/leon-asus-ssh/recovery_authorized_keys
StrictModes yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
HostbasedAuthentication no
UsePAM yes
DisableForwarding yes
PermitTunnel no
GatewayPorts no
X11Forwarding no
PermitUserEnvironment no
PermitUserRC no
UseDNS no
LoginGraceTime 30
MaxAuthTries 2
Subsystem sftp internal-sftp
